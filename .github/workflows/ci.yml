name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DJANGO_SECRET_KEY: ci-secret-key-not-for-production
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
  DATABASE_URL: postgres://rssiasservice:rssiasservice@localhost:5432/rssiasservice
  REDIS_URL: redis://localhost:6379/0
  CORS_ALLOWED_ORIGINS: http://localhost:5173

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rssiasservice
          POSTGRES_USER: rssiasservice
          POSTGRES_PASSWORD: rssiasservice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rssiasservice"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # WeasyPrint (export PDF de la charte, US-4.1) a besoin de Pango/Cairo/
      # GDK-Pixbuf au niveau système — voir backend/Dockerfile pour le même
      # jeu de paquets côté image de production.
      - name: Install WeasyPrint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 \
            libcairo2 \
            libffi8 \
            shared-mime-info \
            fonts-liberation

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Tests (pytest)
        run: pytest --cov=apps --cov-report=term-missing

      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt --strict

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Dependency audit (npm audit)
        run: npm run audit

  # Tests de composants (Vitest + Testing Library). Job dédié et bloquant,
  # séparé de "frontend" : un échec doit se lire immédiatement comme « un
  # comportement d'interface a régressé », sans se confondre avec un lint ou
  # un build cassé. Ne nécessite ni base ni navigateur (jsdom) — donc rapide,
  # contrairement au job e2e.
  frontend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Component tests (vitest)
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Not committed (never commit secrets, CLAUDE.md) — generated fresh for
      # this ephemeral CI run only, same shape as backend/.env.example.
      - name: Write env files for the docker-compose stack
        run: |
          cat > .env <<EOF
          POSTGRES_DB=rssiasservice
          POSTGRES_USER=rssiasservice
          POSTGRES_PASSWORD=ci-postgres-password
          EOF
          cat > backend/.env <<EOF
          DJANGO_SECRET_KEY=ci-e2e-secret-key-not-for-production
          DJANGO_DEBUG=True
          DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS=http://localhost:5173
          FRONTEND_BASE_URL=http://localhost:5173
          AI_PSEUDONYMIZATION_KEY=$(python3 -c "import secrets,base64; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())")
          TOTP_ENCRYPTION_KEY=$(python3 -c "import secrets,base64; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())")
          EOF

      - name: Start the docker-compose stack
        run: docker compose up -d --build postgres redis web worker beat

      - name: Wait for the backend to be ready
        run: |
          # Trace de progression : sans elle, un echec au bout de 120 s ne dit
          # pas si le serveur demarrait lentement ou n'a jamais demarre.
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://localhost:8000/healthz || echo 000)
            if [ "$code" = "200" ]; then
              echo "Backend pret apres $((i * 2))s (HTTP $code)"
              exit 0
            fi
            [ $((i % 5)) -eq 0 ] && echo "  ${i}0s ecoulees — dernier code HTTP : $code"
            sleep 2
          done
          echo "::error::Backend non disponible apres 120 s" >&2
          exit 1

      # Diagnostic execute UNIQUEMENT si l'attente a echoue. On ne devine pas
      # une cause qu'on peut lire : sans ces informations, l'echec precedent
      # se resumait a « pas pret », ce qui n'oriente vers rien.
      - name: Diagnostic (si le backend n'a pas demarre)
        if: failure()
        run: |
          echo "===== Etat des conteneurs ====="
          docker compose ps -a

          echo "===== Etat de sante et codes de sortie ====="
          for s in postgres redis web worker beat; do
            cid=$(docker compose ps -aq "$s" 2>/dev/null | head -1)
            [ -z "$cid" ] && { echo "$s : aucun conteneur"; continue; }
            docker inspect "$cid" --format               "$s : {{.State.Status}} | sortie={{.State.ExitCode}} | redemarrages={{.RestartCount}} | sante={{if .State.Health}}{{.State.Health.Status}}{{else}}aucune{{end}}"
          done

          echo "===== Dernier echec de healthcheck ====="
          for s in postgres redis worker beat; do
            cid=$(docker compose ps -aq "$s" 2>/dev/null | head -1)
            [ -z "$cid" ] && continue
            docker inspect "$cid" --format               "$s : {{if .State.Health}}{{range .State.Health.Log}}{{.ExitCode}} {{.Output}}{{end}}{{else}}aucun healthcheck{{end}}" 2>/dev/null | tail -3
          done

          echo "===== Variables vues par Compose (valeurs masquees) ====="
          # Le defaut n2 de docs/deploiement_production.md : Compose interpole
          # depuis un .env situe A COTE du fichier compose. Un mot de passe
          # vide produit une erreur qui ne designe pas la cause.
          ls -la .env backend/.env 2>&1 || true
          docker compose config 2>&1 | grep -iE "POSTGRES_(DB|USER)|DATABASE_URL" | sed 's/:[^@]*@/:***@/' | head -5

          echo "===== Journaux, tous services ====="
          for s in postgres redis web worker beat; do
            echo "----- $s -----"
            docker compose logs --no-color --tail=60 "$s" 2>&1 || true
          done

      - name: Run Playwright E2E tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Docker compose logs (on failure)
        if: failure()
        run: docker compose logs

      - name: Tear down the stack
        if: always()
        run: docker compose down -v

  container-scan:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t rssi-backend:ci -f backend/Dockerfile backend

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: rssi-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
