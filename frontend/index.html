<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Le .ico d'abord : c'est ce que réclament les navigateurs anciens et
         les agrégateurs de flux. Les modernes préfèrent le PNG déclaré ensuite. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>RSSI as a Service — Surveillance des fuites de données pour les PME</title>
    <meta
      name="description"
      content="Nous surveillons neuf sources de renseignement sur les fuites de données et vous alertons en langage clair, avec l'action à mener. Sans installation."
    />
    <!-- Ces balises servent de valeur par défaut ; chaque page les remplace au
         montage (src/marketing/useSeo.js). Les laisser ici garantit qu'un
         partage de lien avant l'exécution du JavaScript reste correct. -->
    <meta property="og:site_name" content="RSSI as a Service" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://rssiasservice.online/" />
    <meta
      property="og:title"
      content="RSSI as a Service — Surveillance des fuites de données pour les PME"
    />
    <meta
      property="og:description"
      content="Nous surveillons neuf sources de renseignement sur les fuites de données et vous alertons en langage clair, avec l'action à mener."
    />
    <meta property="og:image" content="https://rssiasservice.online/og-image.jpg" />
    <!-- JPEG et non WebP : plusieurs générateurs d'aperçu de lien (messageries,
         réseaux) ignorent encore le WebP et n'afficheraient aucune image. -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://rssiasservice.online/" />
    <meta name="theme-color" content="#2c4a7c" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
