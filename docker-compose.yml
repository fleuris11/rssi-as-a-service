services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rssiasservice}
      POSTGRES_USER: ${POSTGRES_USER:-rssiasservice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rssiasservice}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Host port 5433 (not 5432) to avoid clashing with any other local
      # Postgres instance/container.
      - "5433:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"

  # Applique les migrations UNE SEULE FOIS, avant que web/worker/beat ne
  # demarrent. Sans ce service dedie, les trois les appliquaient en parallele
  # et se disputaient la creation des memes tables (voir backend/entrypoint.sh).
  migrate:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-rssiasservice}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rssiasservice}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    # Migrations PUIS référentiel ANSSI. Le référentiel n'est pas une donnée
    # de démonstration : sans lui, le diagnostic — l'entrée du produit — est
    # indisponible. Le laisser à une commande qu'on lance à la main signifiait
    # qu'il manquait dans tout environnement neuf, intégration continue
    # comprise, et que le poste de développement fonctionnait seulement parce
    # que la commande y avait été passée une fois. Idempotent
    # (`update_or_create`) : rejouable à chaque démarrage sans effet de bord.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py load_anssi_referential"
    restart: "no"

  web:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      # Override the host-oriented values from backend/.env (used when
      # running manage.py/pytest directly on the host) with the
      # in-network service hostnames docker-compose provides.
      DATABASE_URL: postgres://${POSTGRES_USER:-rssiasservice}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rssiasservice}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: python manage.py runserver 0.0.0.0:8000

  worker:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-rssiasservice}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rssiasservice}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
    # Files séparées (cadrage §4.4) : un fournisseur IA en incident ne doit
    # jamais retarder l'envoi d'une alerte, et inversement.
    command: celery -A config worker --loglevel=info -Q monitoring,emails,ai
    healthcheck:
      # Process-level liveness (a worker answers a broker-routed ping to
      # itself). The end-to-end proof that Beat -> this worker -> Redis
      # actually work together is GET /healthz/worker on the web service.
      test: ["CMD-SHELL", "celery -A config inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  beat:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-rssiasservice}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rssiasservice}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
    command: celery -A config beat --loglevel=info --schedule=/tmp/celerybeat-schedule --pidfile=
    healthcheck:
      # Beat has no "inspect ping" equivalent (it doesn't consume tasks) —
      # a recently-touched schedule file is the standard proxy for "still
      # ticking". Same caveat as worker: the deep proof is /healthz/worker.
      test: ["CMD-SHELL", "find /tmp/celerybeat-schedule* -mmin -2 2>/dev/null | grep -q ."]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  postgres_data:
